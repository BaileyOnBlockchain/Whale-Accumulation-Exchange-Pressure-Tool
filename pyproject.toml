[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whale-accumulation-intelligence"
version = "1.0.0"
description = "Whale Accumulation & Exchange-Pressure Intelligence MCP Server — on-chain entity clustering, exchange flow analysis, and accumulation signals with transparent provenance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.21.0",
    "redis[asyncio]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "typer>=0.15.0",
    "numpy>=1.26.0",
    "duckdb>=1.1.0",
    "aiofiles>=24.1.0",
]

[project.scripts]
whale-pipeline = "src.pipeline:main"
whale-mcp     = "src.server.mcp_server:main"
whale-api     = "src.server.http_server:main"
whale-seed    = "scripts.seed_corpus:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
